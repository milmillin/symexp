[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symexp"
version = "0.1.0"
description = "Typed symbolic expressions for optimization models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Milin Kodnongbua", email = "milink@cs.washington.edu" },
]
dependencies = [
    "pydantic",
    "typeguard",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "build>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
]
gurobi = [
    "gurobipy",
]
scipy = [
    "scipy",
]
cuopt = [
    "cuopt-cu12",
]

[project.urls]
Homepage = "https://github.com/milmillin/symexp"
Repository = "https://github.com/milmillin/symexp"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["symexp*"]

[tool.setuptools.package-data]
symexp = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
